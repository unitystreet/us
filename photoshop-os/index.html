<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photoshop OS — El manual definitivo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23001e36%22/><text x=%2250%22 y=%2268%22 font-size=%2254%22 font-family=%22Arial%22 fill=%22%2331a8ff%22 text-anchor=%22middle%22>Ps</text></svg>">
<style>
:root{
  --blue:#31a8ff; --blue-dark:#001e36; --panel:#141414; --panel2:#1d1d1d;
  --border:#333; --text:#e8e8e8; --muted:#9a9a9a; --accent:#ffcc00; --ok:#3ddc84;
  --win-w:min(920px,92vw); --win-h:min(640px,80vh);
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 20% 20%,#0d2a44,#050810 60%);
  overflow:hidden;
  user-select:none;
}

/* ---------- BOOT SCREEN ---------- */
#boot{
  position:fixed;inset:0;background:#000;color:var(--blue);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font-family:"Courier New",monospace;
}
#boot .logo{font-size:64px;font-weight:900;letter-spacing:2px;color:#fff;
  background:linear-gradient(135deg,#31a8ff,#001e36);padding:18px 26px;border-radius:16px;}
#boot .bar{width:280px;height:6px;background:#111;border-radius:4px;overflow:hidden;border:1px solid #223;}
#boot .bar i{display:block;height:100%;width:0;background:var(--blue);animation:load 1.4s ease forwards;}
#boot small{color:var(--muted);letter-spacing:1px;}
@keyframes load{to{width:100%;}}
#boot.hide{animation:fade .4s ease forwards;}
@keyframes fade{to{opacity:0;visibility:hidden;}}

/* ---------- DESKTOP ---------- */
#desktop{position:fixed;inset:0;padding-top:34px;padding-bottom:46px;}
.menubar{
  position:fixed;top:0;left:0;right:0;height:34px;z-index:500;
  background:#111;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:2px;font-size:13px;
}
.menubar .brand{font-weight:800;color:var(--blue);margin-right:14px;letter-spacing:.5px;}
.menubar .m{padding:6px 10px;border-radius:6px;cursor:pointer;color:#ccc;position:relative;}
.menubar .m:hover,.menubar .m.open{background:var(--blue);color:#001e36;font-weight:600;}
.menu-drop{
  position:absolute;top:32px;left:0;min-width:230px;background:#181818;border:1px solid var(--border);
  border-radius:8px;padding:6px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:600;
}
.menu-drop.show{display:block;}
.menu-drop div{padding:7px 10px;border-radius:5px;font-size:12.5px;color:#ddd;cursor:default;}
.menu-drop div:hover{background:#26262b;color:var(--blue);}
.menu-drop .sep{height:1px;background:var(--border);margin:5px 2px;padding:0;}

#icons{
  display:grid;grid-template-columns:repeat(auto-fill,86px);grid-auto-rows:96px;
  gap:6px;padding:18px;height:100%;align-content:start;
}
.icon{
  width:86px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:6px;padding:8px 4px;border-radius:8px;cursor:pointer;text-align:center;
}
.icon:hover,.icon:focus{background:rgba(49,168,255,.18);outline:1px solid rgba(49,168,255,.4);}
.icon .ico{font-size:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.icon span{font-size:11.5px;line-height:1.2;color:#eee;text-shadow:0 1px 2px #000;}

/* ---------- TASKBAR ---------- */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:46px;background:#111;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 8px;z-index:800;
}
#startBtn{
  display:flex;align-items:center;gap:6px;background:var(--blue);color:#001e36;font-weight:800;
  border:none;border-radius:7px;padding:8px 12px;cursor:pointer;font-size:13px;
}
#searchTask{
  flex:0 0 260px;background:#1b1b1b;border:1px solid var(--border);border-radius:7px;color:#eee;
  padding:8px 10px;font-size:13px;
}
#runningApps{display:flex;gap:6px;overflow-x:auto;flex:1;}
.taskchip{background:#1b1b1b;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;color:#ccc;white-space:nowrap;}
.taskchip.active{border-color:var(--blue);color:var(--blue);}
#clock{font-size:12px;color:var(--muted);white-space:nowrap;padding-left:6px;}

/* ---------- START MENU ---------- */
#startMenu{
  position:fixed;left:8px;bottom:50px;width:380px;max-height:70vh;background:#161616;
  border:1px solid var(--border);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);
  display:none;flex-direction:column;z-index:900;overflow:hidden;
}
#startMenu.show{display:flex;}
#startMenu header{padding:12px;border-bottom:1px solid var(--border);}
#startMenu input{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:#0f0f0f;color:#eee;font-size:13px;}
#startResults{overflow:auto;padding:8px;}
.startgroup h4{margin:10px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
.startitem{padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.startitem:hover{background:rgba(49,168,255,.15);}
.startitem b{font-weight:600;}
.startitem small{color:var(--muted);}

/* ---------- WINDOWS ---------- */
.win{
  position:fixed;width:var(--win-w);height:var(--win-h);background:#161616;border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;
  overflow:hidden;z-index:100;
}
.win.min{display:none;}
.win .titlebar{
  height:38px;background:linear-gradient(180deg,#222,#181818);display:flex;align-items:center;
  padding:0 10px;gap:8px;cursor:move;border-bottom:1px solid var(--border);
}
.win .titlebar .dot{width:12px;height:12px;border-radius:50%;cursor:pointer;}
.dot.red{background:#ff5f57;} .dot.yellow{background:#febc2e;} .dot.green{background:#28c840;}
.win .titlebar .title{flex:1;text-align:center;font-size:13px;font-weight:600;color:#ddd;}
.win .body{flex:1;overflow:auto;padding:16px 18px;font-size:13.5px;line-height:1.55;}
.win .body h2{margin:0 0 4px;font-size:19px;color:var(--blue);}
.win .body .sub{color:var(--muted);margin:0 0 16px;font-size:12.5px;}

.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.toolcard{background:#1c1c1c;border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.toolcard h3{margin:0 0 2px;font-size:14.5px;color:#fff;display:flex;align-items:center;gap:8px;}
.toolcard .shortcut{display:inline-block;background:#0f0f0f;border:1px solid var(--border);color:var(--accent);
  font-size:11px;padding:1px 7px;border-radius:5px;margin-left:auto;}
.toolcard p{margin:6px 0;color:#ccc;}
.toolcard ul{margin:6px 0;padding-left:18px;color:#c7c7c7;}
.toolcard .tip{margin-top:8px;font-size:12px;color:var(--ok);border-top:1px dashed var(--border);padding-top:6px;}
.toolcard .tip b{color:var(--ok);}

.pillbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pillbar button{background:#1c1c1c;border:1px solid var(--border);color:#ccc;padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;}
.pillbar button.active{background:var(--blue);color:#001e36;border-color:var(--blue);font-weight:700;}

table.shortcuts{width:100%;border-collapse:collapse;font-size:12.8px;}
table.shortcuts th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);}
table.shortcuts td{padding:7px 8px;border-bottom:1px solid #222;}
table.shortcuts td.key{color:var(--accent);white-space:nowrap;font-family:"Courier New",monospace;}

.menu-card{background:#1c1c1c;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.menu-card h3{margin:0 0 6px;color:var(--blue);font-size:14.5px;}
.menu-card ul{margin:0;padding-left:18px;color:#ccc;}

.step{background:#1c1c1c;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.step h3{margin:0 0 6px;font-size:14.5px;color:var(--blue);}
.step ol{margin:6px 0 0;padding-left:20px;color:#ccc;}
.step ol li{margin-bottom:4px;}

.badge{display:inline-block;background:rgba(49,168,255,.15);color:var(--blue);border:1px solid rgba(49,168,255,.4);
  border-radius:20px;padding:3px 10px;font-size:11px;margin-bottom:10px;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:640px){
  #searchTask{display:none;}
  .icon{width:76px;}
  #startMenu{width:92vw;}
}
</style>
</head>
<body>

<div id="boot">
  <div class="logo">Ps OS</div>
  <div class="bar"><i></i></div>
  <small>INICIANDO PHOTOSHOP OS · CARGANDO MANUAL COMPLETO…</small>
</div>

<div id="desktop">
  <div class="menubar" id="menubar">
    <div class="brand">Ps OS</div>

  </div>
  <div id="icons"></div>
</div>

<div id="startMenu">

  <div id="startResults"></div>

<div id="taskbar">

  <input id="searchTask" placeholder="Buscar herramienta… (ej. lazo, pluma, dodge)">
  <div id="runningApps"></div>
  <div id="clock"></div>
</div>

<div id="windows"></div>

/* =========================================================
   WINDOW MANAGER
   ========================================================= */
let zTop = 100;
const openWins = {}; // id -> {el, minimized}

function openApp(id){
  const cat = CATEGORIES.find(c=>c.id===id);
  if(!cat) return;
  if(openWins[id]){
    restoreWin(id);
    return;
  }
  const win = document.createElement('div');
  win.className = 'win';
  win.id = 'win-'+id;
  const offset = Object.keys(openWins).length * 26 % 160;
  win.style.left = (60+offset)+'px';
  win.style.top = (44+offset)+'px';
  win.innerHTML = `
    <div class="titlebar" data-drag>
      <div class="dot red" data-close></div>
      <div class="dot yellow" data-min></div>
      <div class="dot green" data-max></div>
      <div class="title">${cat.icon} ${esc(cat.name)}</div>
    </div>
    <div class="body">
      <h2>${cat.icon} ${esc(cat.name)}</h2>
      ${RENDERERS[id] ? RENDERERS[id]() : '<p>Contenido no disponible.</p>'}
    </div>`;
  document.getElementById('windows').appendChild(win);
  openWins[id] = {el:win, minimized:false};
  makeDraggable(win);
  win.querySelector('[data-close]').onclick = ()=>closeWin(id);
  win.querySelector('[data-min]').onclick = ()=>minimizeWin(id);
  win.querySelector('[data-max]').onclick = ()=>toggleMaximize(win);
  win.addEventListener('mousedown', ()=>focusWin(id));
  focusWin(id);
  renderTaskbar();
}

function focusWin(id){
  const w = openWins[id]; if(!w) return;
  zTop += 1;
  w.el.style.zIndex = zTop;
  document.querySelectorAll('.taskchip').forEach(c=>c.classList.toggle('active', c.dataset.id===id));
}

function closeWin(id){
  const w = openWins[id]; if(!w) return;
  w.el.remove();
  delete openWins[id];
  renderTaskbar();
}

function minimizeWin(id){
  const w = openWins[id]; if(!w) return;
  w.el.classList.add('min');
  w.minimized = true;
  renderTaskbar();
}

function restoreWin(id){
  const w = openWins[id]; if(!w) return;
  w.el.classList.remove('min');
  w.minimized = false;
  focusWin(id);
  renderTaskbar();
}

function toggleMaximize(win){
  if(win.dataset.max==='1'){
    win.style.width='var(--win-w)'; win.style.height='var(--win-h)';
    win.style.left = win.dataset.prevLeft; win.style.top = win.dataset.prevTop;
    win.dataset.max='0';
  }else{
    win.dataset.prevLeft = win.style.left; win.dataset.prevTop = win.style.top;
    win.style.left='2vw'; win.style.top='40px'; win.style.width='96vw'; win.style.height='calc(100vh - 100px)';
    win.dataset.max='1';
  }
}

function makeDraggable(win){
  const bar = win.querySelector('[data-drag]');
  let sx,sy,ox,oy,dragging=false;
  bar.addEventListener('mousedown',e=>{
    if(e.target.closest('.dot')) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    const r = win.getBoundingClientRect(); ox=r.left; oy=r.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    win.style.left = Math.max(0, ox + (e.clientX-sx)) + 'px';
    win.style.top = Math.max(34, oy + (e.clientY-sy)) + 'px';
  });
  window.addEventListener('mouseup',()=>dragging=false);
}

function renderTaskbar(){
  const box = document.getElementById('runningApps');
  box.innerHTML = '';
  Object.keys(openWins).forEach(id=>{
    const cat = CATEGORIES.find(c=>c.id===id);
    const chip = document.createElement('div');
    chip.className = 'taskchip';
    chip.dataset.id = id;
    chip.textContent = `${cat.icon} ${cat.name}`;
    chip.onclick = ()=>{
      if(openWins[id].minimized) restoreWin(id);
      else { minimizeWin(id); }
    };
    box.appendChild(chip);
  });
}

  drop.querySelector('[data-open]').onclick = (e)=>{e.stopPropagation(); openApp('menus'); drop.classList.remove('show'); item.classList.remove('open');};
  menubar.appendChild(item);
});

  document.querySelectorAll('.menubar .m.open').forEach(d=>d.classList.remove('open'));

/* =========================================================
   SEARCH (taskbar + start menu)
   ========================================================= */
function buildIndex(){
  const idx = [];
  TOOLS.forEach(t=>idx.push({type:'Herramienta',name:t.n,extra:t.k,cat:t.g,tool:t}));
  PANELS.forEach(p=>idx.push({type:'Panel',name:p.n,extra:'',cat:'paneles'}));
  SHORTCUTS.forEach(([a,k])=>idx.push({type:'Atajo',name:a,extra:k,cat:'atajos'}));
  MENUS.forEach(m=>idx.push({type:'Menú',name:m.n,extra:'',cat:'menus'}));
  AI_TOOLS.forEach(t=>idx.push({type:'IA',name:t.n,extra:'',cat:'ia'}));
  WORKFLOWS.forEach(w=>idx.push({type:'Flujo',name:w.n,extra:'',cat:'flujos'}));
  GLOSSARY.forEach(([a])=>idx.push({type:'Glosario',name:a,extra:'',cat:'glosario'}));
  return idx;
}
const SEARCH_INDEX = buildIndex();

function runSearch(q, into){
  q = q.trim().toLowerCase();
  into.innerHTML = '';
  if(!q){
    const groups = {};
    CATEGORIES.filter(c=>c.id!=='inicio').forEach(c=>groups[c.id]=[]);
    into.innerHTML = `<div class="startgroup"><h4>Categorías</h4>${CATEGORIES.map(c=>`<div class="startitem" data-open="${c.id}"><b>${c.icon} ${esc(c.name)}</b></div>`).join('')}</div>`;
  }else{
    const res = SEARCH_INDEX.filter(r=>r.name.toLowerCase().includes(q)).slice(0,40);
    if(!res.length){ into.innerHTML = `<div class="startgroup"><h4>Sin resultados</h4><div class="startitem">Prueba con otra palabra…</div></div>`; }
    else{
      into.innerHTML = `<div class="startgroup"><h4>${res.length} resultados</h4>${res.map(r=>
        `<div class="startitem" data-open="${r.cat}"><b>${esc(r.name)}</b><small>${r.type}${r.extra?' · '+esc(r.extra):''}</small></div>`
      ).join('')}</div>`;
    }
  }
  into.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ openApp(el.dataset.open); document.getElementById('startMenu').classList.remove('show'); };
  });
}

const startResults = document.getElementById('startResults');
runSearch('', startResults);
document.getElementById('searchStart').addEventListener('input', e=>runSearch(e.target.value, startResults));
document.getElementById('searchTask').addEventListener('input', e=>{
  document.getElementById('searchStart').value = e.target.value;
  document.getElementById('startMenu').classList.add('show');
  runSearch(e.target.value, startResults);
});

const startBtn = document.getElementById('startBtn');
const startMenu = document.getElementById('startMenu');
startBtn.onclick = (e)=>{ e.stopPropagation(); startMenu.classList.toggle('show'); document.getElementById('searchStart').focus(); };
document.addEventListener('click', (e)=>{
  if(!startMenu.contains(e.target) && e.target!==startBtn) startMenu.classList.remove('show');
});

/* =========================================================
   CLOCK + BOOT
   ========================================================= */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock,1000*30);

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    const boot = document.getElementById('boot');
    boot.classList.add('hide');
    setTimeout(()=>{ boot.style.display='none'; openApp('inicio'); }, 420);
  }, 1200);
});
</script>
