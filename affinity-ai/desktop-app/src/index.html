<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.anthropic.com https://api.openai.com;" />
<title>Afina</title>
<style>
  :root {
    --canvas-bg: #0e1116;
    --panel-bg: #181d24;
    --panel-header: #12161c;
    --panel-border: #262d37;
    --text-primary: #e9eaec;
    --text-secondary: #9aa3af;
    --text-muted: #6b7480;
    --accent: #7c6cff;
    --accent-soft: rgba(124, 108, 255, 0.16);
    --ok: #34c58b;
    --info: #4fa8e0;
    --warn: #e3a23a;
    --danger: #e0577b;
    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--canvas-bg);
    color: var(--text-primary);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; border: 1px solid var(--panel-border); border-radius: 12px; overflow: hidden; }

  .titlebar {
    -webkit-app-region: drag;
    background: var(--panel-header);
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 10px 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
  .brand-tag { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .win-controls { -webkit-app-region: no-drag; display: flex; gap: 6px; }
  .win-controls button {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--panel-border);
    background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.85rem; line-height: 1;
  }
  .win-controls button:hover { color: var(--text-primary); border-color: var(--accent); }

  .body { flex: 1; overflow-y: auto; padding: 12px 14px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { flex: 1; background: transparent; border: 1px solid var(--panel-border); color: var(--text-secondary); font-size: 0.76rem; font-weight: 600; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  .tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text-primary); }
  .panel[hidden] { display: none; }

  .field-label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%; background: var(--canvas-bg); border: 1px solid var(--panel-border); color: var(--text-primary);
    font-family: var(--font-ui); font-size: 0.88rem; padding: 8px 9px; border-radius: 8px; resize: vertical;
  }
  textarea { font-family: var(--font-mono); font-size: 0.76rem; line-height: 1.5; }

  .results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .card { border: 1px solid var(--panel-border); background: rgba(255,255,255,0.015); border-radius: 10px; padding: 9px 11px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .card-app { font-size: 0.64rem; color: var(--text-muted); text-align: right; }
  .card-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; margin: 0 0 4px; }
  .card-equiv { font-size: 0.8rem; margin: 0 0 4px; }
  .card-loc, .card-shortcut { font-size: 0.72rem; color: var(--text-secondary); margin: 0 0 3px; }
  .card-notes { font-size: 0.75rem; color: var(--text-secondary); margin: 6px 0 0; line-height: 1.4; }
  .mono { font-family: var(--font-mono); color: var(--text-primary); }
  .badge { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .badge.estable { background: rgba(52,197,139,0.15); color: var(--ok); }
  .badge.similar { background: rgba(79,168,224,0.15); color: var(--info); }
  .badge.workaround { background: rgba(227,162,58,0.15); color: var(--warn); }
  .badge.verificar { background: rgba(224,87,123,0.15); color: var(--danger); }
  .empty-state { font-size: 0.78rem; color: var(--text-muted); padding: 8px 2px; }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .btn { background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 0.8rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .btn.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text-secondary); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .status-text { font-size: 0.72rem; color: var(--text-muted); }

  .preview-line { border-left: 2px solid var(--panel-border); padding: 6px 0 6px 10px; margin-bottom: 6px; }
  .preview-line-text { font-size: 0.78rem; color: var(--text-secondary); margin: 0 0 4px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.65rem; border: 1px solid var(--panel-border); padding: 2px 7px; border-radius: 999px; }
  .unmatched-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }

  .expert-report { margin-top: 12px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 11px; font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; }

  .settings-group { margin-bottom: 16px; }
  .settings-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--panel-border); }
  .shortcut-note { margin-top: 16px; font-size: 0.72rem; color: var(--text-muted); border-top: 1px solid var(--panel-border); padding-top: 10px; }
</style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Afina</span>
        <span class="brand-tag">Copiloto Affinity</span>
      </div>
      <div class="win-controls">
        <button id="minBtn" title="Ocultar (Ctrl/Cmd+Alt+A para volver a mostrar)">—</button>
        <button id="closeBtn" title="Ocultar">×</button>
      </div>
    </header>

    <main class="body">
      <nav class="tabs" role="tablist">
        <button class="tab active" id="tabQuickBtn">Rápido</button>
        <button class="tab" id="tabTutorialBtn">Tutorial</button>
        <button class="tab" id="tabSettingsBtn">Ajustes</button>
      </nav>

      <section class="panel" id="panelQuick">
        <label class="field-label" for="quickQuery">Herramienta o concepto de Photoshop / Illustrator</label>
        <input type="text" id="quickQuery" value="smart object" autocomplete="off" />
        <div class="results" id="quickResults"></div>
      </section>

      <section class="panel" id="panelTutorial" hidden>
        <label class="field-label" for="tutorialInput">Pega los pasos del tutorial (o transcribe un audio/video abajo)</label>
        <textarea id="tutorialInput" rows="5">1. Duplica la capa y conviértela en Smart Object.
2. Aplica Camera Raw Filter para ajustar la temperatura.
3. Usa el Pen Tool para recortar el producto.</textarea>

        <div class="row">
          <button class="btn secondary" id="pickAudioBtn">🎙 Transcribir audio/video…</button>
          <span class="status-text" id="transcribeStatus"></span>
        </div>

        <div class="row">
          <button class="btn" id="analyzeBtn">Traducir con IA experta</button>
          <span class="status-text" id="analyzeStatus"></span>
        </div>

        <div class="local-preview" id="localPreview"></div>
        <div class="expert-report" id="expertReport" hidden></div>
      </section>

      <section class="panel" id="panelSettings" hidden>
        <div class="settings-group">
          <label class="field-label" for="anthropicKey">Clave de API — Anthropic (Claude, para el análisis experto)</label>
          <input type="password" id="anthropicKey" placeholder="sk-ant-..." />
          <p class="settings-hint">Se guarda solo en tu computadora (config local), nunca en este repositorio ni en la nube de Afina.</p>
        </div>
        <div class="settings-group">
          <label class="field-label" for="model">Modelo</label>
          <input type="text" id="model" value="claude-sonnet-5" />
        </div>
        <div class="settings-group">
          <label class="field-label" for="openaiKey">Clave de API — OpenAI (Whisper, para transcribir video/audio)</label>
          <input type="password" id="openaiKey" placeholder="sk-..." />
        </div>
        <div class="toggle-row">
          <span class="field-label" style="margin:0">Mantener siempre visible (flotar sobre otras apps)</span>
          <input type="checkbox" id="alwaysOnTop" />
        </div>
        <div class="row">
          <button class="btn" id="saveSettingsBtn">Guardar</button>
          <span class="status-text" id="settingsStatus"></span>
        </div>
        <p class="shortcut-note">Atajo global: <span class="mono">Ctrl/Cmd + Alt + A</span> muestra u oculta a Afina desde cualquier programa.</p>
      </section>
    </main>
  </div>

<script src="core/knowledge-base.js"></script>
<script src="core/engine.js"></script>
<script src="renderer.js"></script>
</body>
</html>
